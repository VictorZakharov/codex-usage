name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, build, and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce linear pull-request history
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $base = "${{ github.event.pull_request.base.sha }}"
          $mergeCommits = @(git rev-list --merges "$base..HEAD")
          if ($mergeCommits.Count -eq 0) {
            Write-Host "Pull-request history is linear."
            exit 0
          }

          Write-Error "Pull-request branches must not contain merge commits. Rebase the branch onto main."
          git show --no-patch --format="%h %s" $mergeCommits
          exit 1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodexUsage.sln

      - name: Verify formatting
        run: dotnet format CodexUsage.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CodexUsage.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet run
          --project .\tests\CodexUsage.Tests\CodexUsage.Tests.csproj
          --configuration Release
          --no-build
